services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: "local-dev-secret"
      DATABASE_URL: "postgresql://coinsight:coinsight@db:5432/coinsight"
      MAX_FAVORITE_MARKETS: "5"
      ANALYSIS_CACHE_MINUTES: "30"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "coinsight"
      POSTGRES_USER: "coinsight"
      POSTGRES_PASSWORD: "coinsight"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinsight -d coinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
